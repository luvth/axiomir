name: Release

# Builds cross-platform `axiom` binaries and publishes them as assets on the
# GitHub Release for every version tag. The gating checks (fmt, clippy, test,
# conformance) must be green before any asset is uploaded.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Conformance suite
        run: cargo run --target ${{ matrix.target }} -p axiom-cli -- conform

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p axiom-cli

      - name: Package and checksum
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          asset="axiom-${{ matrix.target }}${{ matrix.ext }}"
          cp "axiom${{ matrix.ext }}" "$asset"
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/${{ env.ASSET }}
            target/${{ matrix.target }}/release/${{ env.ASSET }}.sha256
