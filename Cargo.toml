[workspace]
resolver = "2"
members = [
    "crates/axiom-types",
    "crates/axiom-encoding",
    "crates/axiom-core",
    "crates/axiom-parser",
    "crates/axiom-runtime",
    "crates/axiom-incremental",
    "crates/axiom-conformance",
    "crates/axiom-cli",
    "crates/axiom-sdk",
    "benches",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Axiom IR Authors"]
repository = "https://example.org/axiom-ir"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
indexmap = "2"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
proptest = "1"
axiom-types = { path = "crates/axiom-types" }
axiom-encoding = { path = "crates/axiom-encoding" }
axiom-core = { path = "crates/axiom-core" }
axiom-parser = { path = "crates/axiom-parser" }
axiom-runtime = { path = "crates/axiom-runtime" }
axiom-incremental = { path = "crates/axiom-incremental" }
axiom-conformance = { path = "crates/axiom-conformance" }
axiom-sdk = { path = "crates/axiom-sdk" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.bench]
opt-level = 3
lto = "thin"

